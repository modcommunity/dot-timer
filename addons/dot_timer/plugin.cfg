[plugin]

name="dot-timer"
description="Speedrun timers for bunny-hop, surf, KZ and any other run-against-the-clock game: zones a mapper draws in the world, tracks and stages, styles, per-run statistics, replays, records and leaderboards. Counted in ticks with sub-tick zone crossings, so a run set on a 64 Hz server is comparable with one set on a 128 Hz server."
author="dot"
version="0.1.0"
script="dot_timer_plugin.gd"
